    <!-- 全域修復：忽略 ResizeObserver 良性通知警告與無害未捕捉錯誤 -->
    <script>
        window.addEventListener('error', function (e) {
            if (e.message && (
                e.message.includes('ResizeObserver loop completed with undelivered notifications') ||
                e.message.includes('ResizeObserver loop limit exceeded')
            )) {
                e.stopImmediatePropagation();
                e.preventDefault();
            }
        }, true);

        window.addEventListener('unhandledrejection', function (e) {
            if (e.reason && e.reason.message && (
                e.reason.message.includes('ResizeObserver loop completed with undelivered notifications') ||
                e.reason.message.includes('ResizeObserver loop limit exceeded')
            )) {
                e.stopImmediatePropagation();
                e.preventDefault();
            }
        });

        if (typeof window.ResizeObserver !== 'undefined') {
            const NativeResizeObserver = window.ResizeObserver;
            window.ResizeObserver = class ResizeObserver extends NativeResizeObserver {
                constructor(callback) {
                    super((entries, observer) => {
                        window.requestAnimationFrame(() => {
                            try {
                                callback(entries, observer);
                            } catch (err) {
                                if (!err.message || !err.message.includes('ResizeObserver loop completed with undelivered notifications')) {
                                    throw err;
                                }
                            }
                        });
                    });
                }
            };
        }
    </script>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

            <!-- 繁簡轉換按鈕 -->

    <!-- 主要內容區域 -->

            <div>
                <h2 class="text-lg md:text-xl font-bold text-amber-400 mb-1 flex items-center justify-center md:justify-start gap-2" data-i18n="sectionHeader">

                <p class="text-sm text-slate-300" data-i18n="sectionDesc">

            <div class="inline-flex items-center px-4 py-2 rounded-full bg-slate-700/50 border border-slate-600 text-xs text-slate-300 whitespace-nowrap">

        <!-- 嵌入 Elfsight Social Feed 模組區塊 -->
        <div class="bg-slate-800/40 rounded-3xl p-4 md:p-6 border border-slate-800 shadow-2xl min-h-[400px]">

    <!-- 頁尾 Footer -->
    <footer class="border-t border-slate-800 bg-slate-950 py-6 text-center text-xs text-slate-500">
        <p data-i18n="footerText">
            © 沙雕動畫星球 - 專治各種不開心，讓你笑出八顆牙齒
        </p>
    </footer>

    <!-- 繁簡切換邏輯腳本 -->
    <script>
        // 多語言字典數據
        const i18nData = {
            'zh-TW': {
                title: '沙雕動畫星球',
                subtitle: '每日更新最新沙雕爆笑短劇',
                sectionHeader: '爆笑動畫動態牆',
                sectionDesc: '匯聚網絡熱門沙雕動畫與搞笑迷因短影片，點擊下方卡片即可輕鬆播放！',
                statusText: '即時動態更新中',
                footerText: '© 沙雕動畫星球 - 專治各種不開心，讓你笑出八顆牙齒',
                btnText: '简体中文'
            },
            'zh-CN': {
                title: '沙雕动画星球',
                subtitle: '每日更新最新沙雕爆笑短剧',
                sectionHeader: '爆笑动画动态墙',
                sectionDesc: '汇聚网络热门沙雕动画与搞笑迷因短视频，点击下方卡片即可轻松播放！',
                statusText: '实时动态更新中',
                footerText: '© 沙雕动画星球 - 专治各种不开心，让你笑出八颗牙齿',
                btnText: '繁體中文'
            }
        };

        // 當前語言狀態，預設為繁體中文
        let currentLang = 'zh-TW';

        function toggleLanguage() {
            currentLang = currentLang === 'zh-TW' ? 'zh-CN' : 'zh-TW';
            updatePageLanguage();
        }

        function updatePageLanguage() {
            const data = i18nData[currentLang];
            
            // 更新文字內容
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (data[key]) {
                    el.innerText = data[key];
                }
            });

            // 更新按鈕顯示文字
            document.getElementById('langLabel').innerText = data.btnText;
            
            // 更新 html lang 屬性
            document.documentElement.lang = currentLang;
        }
    </script>
</body>
</html>
